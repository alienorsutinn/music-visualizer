<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora Film Engine (Prototype)</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="brand">Aurora Film Engine (Prototype)</div>
      <label class="file-button" for="file-input">Drop a track
        <input type="file" id="file-input" accept="audio/*" />
      </label>
      <button id="play-pause" class="control">Play</button>
      <select id="scene-select" class="control">
        <option value="side-scroller">Side-scroller journey</option>
        <option value="moving-room">Moving room performance</option>
      </select>
    </header>

    <main class="canvas-wrapper" id="drop-zone">
      <canvas id="visualizer"></canvas>
      <div class="drop-hint">Drop your audio file anywhere</div>
    </main>
  </div>

  <audio id="audio" crossorigin="anonymous"></audio>
  <script src="src/engine.js"></script>
</body>
</html>
