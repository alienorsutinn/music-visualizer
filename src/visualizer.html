<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Pulse – Visualizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="visualizer">
  <div class="controls">
    <h1 class="title">Aurora Pulse</h1>
    <p class="subtitle">Capturing this tab's audio and painting the spectrum.</p>
    <div class="buttons">
      <button id="start" class="primary">Start Visualizer</button>
      <button id="stop" class="secondary">Stop</button>
      <label class="mode-toggle" for="mode">Mode</label>
      <select id="mode" class="select">
        <option value="bars">Neon Bars</option>
        <option value="orbit">Orbital Glow</option>
      </select>
    </div>
  </div>
  <canvas id="canvas"></canvas>
  <script src="visualizer.js"></script>
</body>
</html>
