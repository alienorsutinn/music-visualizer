<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Pulse – Visualizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="visualizer">
  <header class="control-bar">
    <div class="brand">
      <span class="logo-dot"></span>
      <span class="app-name">Aurora Pulse</span>
    </div>
    <div class="control-groups">
      <div class="mode-toggle" role="group" aria-label="Visualizer modes">
        <button id="mode-bars" class="pill active" type="button">Bars</button>
        <button id="mode-radial" class="pill" type="button">Radial</button>
      </div>
      <div class="source-toggle" role="group" aria-label="Audio source">
        <button id="start-mic" class="pill" type="button">Use microphone</button>
        <label class="pill file-pill" for="file-input">Upload audio</label>
        <input id="file-input" type="file" accept="audio/*,video/*" />
      </div>
    </div>
  </header>
  <main class="visualizer-stage">
    <canvas id="canvas"></canvas>
    <div id="overlay" class="overlay visible">
      <p class="overlay-title">Feed Aurora Pulse</p>
      <p class="overlay-subtitle">Choose microphone or drop in an audio/video file to start the show.</p>
    </div>
  </main>
  <script src="visualizer.js"></script>
</body>
</html>
